<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etherlight - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #c8ff00; /* Warna hijau cerah persis seperti gambar */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Wadah Utama */
        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        /* Bagian Logo & Nama */
        .brand {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* Ikon Logo Etherlight */
        .logo-icon {
            width: 140px;
            height: 140px;
            position: relative;
        }

        .logo-diamond {
            width: 100%;
            height: 100%;
            background-color: #000000;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-star {
            width: 70%;
            height: 70%;
            background-color: #c8ff00;
            clip-path: polygon(50% 0%, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0% 50%, 40% 40%);
        }

        .brand-name {
            font-size: 96px;
            font-weight: 900;
            color: #000000;
            letter-spacing: -2px;
        }

        /* Teks Coming Soon */
        .coming-soon {
            font-size: 24px;
            color: #556b00; /* Warna hijau gelap seperti aslinya */
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 500;
        }

        /* Tombol Media Sosial */
        .social-button {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 32px;
            border: 2px solid #556b00;
            border-radius: 50px;
            text-decoration: none;
            color: #000000;
            font-size: 28px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .social-button:hover {
            background-color: rgba(0,0,0,0.05);
        }

        .x-icon {
            width: 32px;
            height: 32px;
        }

        /* Teks Website di Bawah */
        .footer-text {
            position: absolute;
            bottom: 40px;
            font-size: 24px;
            color: #556b00;
            opacity: 0.8;
        }

        /* Responsif untuk HP */
        @media (max-width: 768px) {
            .brand {
                flex-direction: column;
                gap: 16px;
            }
            .brand-name {
                font-size: 64px;
            }
            .logo-icon {
                width: 100px;
                height: 100px;
            }
            .social-button {
                font-size: 22px;
                padding: 12px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo & Nama Etherlight -->
        <div class="brand">
            <div class="logo-icon">
                <div class="logo-diamond">
                    <div class="logo-star"></div>
                </div>
            </div>
            <h1 class="brand-name">Etherlight</h1>
        </div>

        <!-- Teks Coming Soon -->
        <p class="coming-soon">COMING SOON</p>

        <!-- Tombol Sosial Media -->
        <a href="#" class="social-button">
            <svg class="x-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
            @etherlightcoin
        </a>
    </div>


</body>
</html>
